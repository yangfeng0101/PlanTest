events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # WebSocket mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker DNS resolver (Required for variable-based proxy_pass)
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Use variables to allow Nginx to start even if backends are down.
        # MUST use actual Docker service names here.
        set $device_svc_backend "device-svc:8001";
        set $screen_svc_backend "screen-svc:8002";
        set $test_svc_backend "test-svc:8001";
        set $report_svc_backend "report-svc:8002";
        set $ai_svc_backend "ai-svc:8005";

        # Disable cache for index.html
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        # Cache static assets
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for monitoring
        location = /api/v1/devices/ws {
            proxy_pass http://$device_svc_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
        }

        # WebSocket support for screen streaming
        location /ws/ {
            proxy_pass http://$screen_svc_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
        }

        # API Routes
        location /api/v1/auth { proxy_pass http://$test_svc_backend; }
        location /api/v1/users { proxy_pass http://$test_svc_backend; }
        location /api/v1/scripts { proxy_pass http://$test_svc_backend; }
        location /api/v1/schedules { proxy_pass http://$test_svc_backend; }
        location /api/v1/tasks { proxy_pass http://$test_svc_backend; }
        
        location /api/v1/devices { proxy_pass http://$device_svc_backend; }
        location /api/v1/metrics { proxy_pass http://$device_svc_backend; }
        
        location /api/v1/reports { proxy_pass http://$report_svc_backend; }
        location /api/v1/statistics { proxy_pass http://$report_svc_backend; }
        location /api/v1/alerts { proxy_pass http://$report_svc_backend; }
        location /api/v1/export { proxy_pass http://$report_svc_backend; }
        
        location /api/v1/ocr { proxy_pass http://$ai_svc_backend; }
        location /api/v1/locate { proxy_pass http://$ai_svc_backend; }
        location /api/v1/generate { proxy_pass http://$ai_svc_backend; }
        location /api/v1/sessions/ { proxy_pass http://$screen_svc_backend; }

        # Health check
        location /health {
            default_type text/plain;
            return 200 'OK';
        }

        # Frontend SPA Support
        location / {
            try_files $uri $uri/ /index.html;
            add_header 'Access-Control-Allow-Origin' '*' always;
        }
    }
}
