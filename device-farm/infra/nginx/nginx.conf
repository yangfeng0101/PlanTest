events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream device_service { server device-svc:8001; }
    upstream screen_service { server screen-svc:8002; }
    upstream test_service { server test-svc:8001; }
    upstream report_service { server report-svc:8002; }
    upstream ai_service { server ai-svc:8005; }

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # SPA Support
        location / {
            try_files $uri $uri/ /index.html;
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API Routes
        location /api/v1/auth { proxy_pass http://test_service; }
        location /api/v1/users { proxy_pass http://test_service; }
        location /api/v1/scripts { proxy_pass http://test_service; }
        location /api/v1/schedules { proxy_pass http://test_service; }
        location /api/v1/tasks { proxy_pass http://test_service; }
        
        location /api/v1/devices { proxy_pass http://device_service; }
        location /api/v1/metrics { proxy_pass http://device_service; }
        
        location /api/v1/reports { proxy_pass http://report_service; }
        location /api/v1/statistics { proxy_pass http://report_service; }
        location /api/v1/alerts { proxy_pass http://report_service; }
        location /api/v1/export { proxy_pass http://report_service; }
        
        location /api/v1/ocr { proxy_pass http://ai_service; }
        location /api/v1/locate { proxy_pass http://ai_service; }
        location /api/v1/generate { proxy_pass http://ai_service; }

        # WebSocket support for monitoring
        location = /api/v1/devices/ws {
            proxy_pass http://device_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
        }

        # WebSocket support for screen streaming
        location ~ ^/api/v1/sessions/[^/]+ {
            proxy_pass http://screen_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
        }

        location /health {
            default_type text/plain;
            return 200 'OK';
        }
    }
}
