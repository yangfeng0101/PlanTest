version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: device-farm-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-devicefarm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devicefarm123}
      POSTGRES_DB: ${DB_NAME:-device_farm}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-devicefarm} -d ${DB_NAME:-device_farm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - device-farm-network

  redis:
    image: redis:7-alpine
    container_name: device-farm-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - device-farm-network

  minio:
    image: minio/minio:latest
    container_name: device-farm-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - device-farm-network

  nginx:
    image: nginx:alpine
    container_name: device-farm-nginx
    ports:
      - "3000:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
      - ../api:/etc/nginx/api:ro
      - ../../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - device-svc
      - screen-svc
      - test-svc
      - report-svc
    networks:
      - device-farm-network

  mock-server:
    build:
      context: ../mock
      dockerfile: Dockerfile
    container_name: device-farm-mock
    ports:
      - "3001:3000"
    networks:
      - device-farm-network

  device-svc:
    build:
      context: ../../services
      dockerfile: device-svc/Dockerfile
    container_name: device-farm-device-svc
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://devicefarm:devicefarm123@postgres:5432/device_farm
      - REDIS_URL=redis://:redis123@redis:6379/0
      - ADB_SERVER_HOST=host.docker.internal
      - ADB_SERVER_PORT=5037
      - REPORT_SVC_URL=http://report-svc:8002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis
    networks:
      - device-farm-network

  screen-svc:
    build:
      context: ../../services/screen-svc
      dockerfile: Dockerfile
    container_name: device-farm-screen-svc
    ports:
      - "8002:8002"
    environment:
      - DEVICE_SVC_URL=http://device-svc:8001
    networks:
      - device-farm-network

  test-svc:
    build:
      context: ../../services
      dockerfile: test-svc/Dockerfile
    container_name: device-farm-test-svc
    ports:
      - "8003:8001"
    environment:
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://devicefarm:devicefarm123@postgres:5432/device_farm
      - REDIS_URL=redis://:redis123@redis:6379/0
      - CELERY_BROKER_URL=redis://:redis123@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:redis123@redis:6379/2
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - REPORT_SERVICE_URL=http://report-svc:8002
      - DEVICE_SERVICE_URL=http://device-svc:8001
      - API_KEY_ENABLED=false
      - JWT_SECRET_KEY=yoursecretkeymustbeatleast32characterslong
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - device-farm-network

  report-svc:
    build:
      context: ../../services
      dockerfile: report-svc/Dockerfile
    container_name: device-farm-report-svc
    ports:
      - "8004:8002"
    environment:
      - DATABASE_URL=postgresql+asyncpg://devicefarm:devicefarm123@postgres:5432/device_farm
      - REDIS_HOST=redis
      - REDIS_PASSWORD=redis123
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - TEST_SERVICE_URL=http://test-svc:8001
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - device-farm-network

  ai-svc:
    build:
      context: ../../services
      dockerfile: ai-svc/Dockerfile
    container_name: device-farm-ai-svc
    ports:
      - "8005:8005"
    environment:
      - TEST_SVC_URL=http://test-svc:8001
    depends_on:
      - test-svc
    networks:
      - device-farm-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  device-farm-network:
    driver: bridge
