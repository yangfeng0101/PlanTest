server:
  host: "0.0.0.0"
  port: 8002

scrcpy:
  max_resolution: 1080
  max_fps: 30
  bit_rate: 2000000
  codec: "h264"
  server_path: "/usr/share/scrcpy/scrcpy-server"

livekit:
  url: "ws://livekit:7880"
  api_key: "devkey"
  api_secret: "my_secret_key_needs_to_be_at_least_32_characters_long"

webrtc:
  min_port: 40000
  max_port: 50000
  ice_servers:
    - urls:
        - "stun:stun.l.google.com:19302"

device:
  service_url: "http://device-svc:8001"

auth:
  enabled: true
  test_service_url: "http://test-svc:8001"

log_level: "info"
