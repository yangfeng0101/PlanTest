<!DOCTYPE html>
<html>
<head>
  <title>H.264 Stream Test</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #1a1a2e; color: #eee; }
    #video { width: 480px; background: #000; }
    #status { margin: 10px 0; padding: 10px; background: #16213e; border-radius: 4px; }
    #stats { margin: 10px 0; font-size: 14px; color: #7f8c8d; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    .connected { color: #2ecc71; }
    .error { color: #e74c3c; }
  </style>
</head>
<body>
  <h1>H.264 Stream Test (MSE)</h1>
  <div id="status">Disconnected</div>
  <div id="stats">FPS: 0 | Frames: 0 | Keyframes: 0</div>
  <video id="video" autoplay muted playsinline></video>
  <br>
  <button onclick="connect()">Connect</button>
  <button onclick="disconnect()">Disconnect</button>

  <script>
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const stats = document.getElementById('stats');

    let ws = null;
    let mediaSource = null;
    let sourceBuffer = null;
    let frameCount = 0;
    let keyframeCount = 0;
    let lastFpsTime = Date.now();
    let fpsCounter = 0;

    // H.264 codec string for MSE
    const H264_CODEC = 'video/mp4; codecs="avc1.64000a"';

    function connect() {
      const deviceId = '2c183953';
      const wsUrl = `ws://localhost:8080/ws/${deviceId}`;

      status.textContent = `Connecting to ${wsUrl}...`;

      // Setup MSE
      mediaSource = new MediaSource();
      video.src = URL.createObjectURL(mediaSource);

      mediaSource.addEventListener('sourceopen', () => {
        console.log('MediaSource opened');

        try {
          sourceBuffer = mediaSource.addSourceBuffer(H264_CODEC);
          sourceBuffer.mode = 'sequence';

          sourceBuffer.addEventListener('error', (e) => {
            console.error('SourceBuffer error:', e);
            status.textContent = 'SourceBuffer error';
            status.className = 'error';
          });

          // Connect WebSocket
          ws = new WebSocket(wsUrl);

          ws.onopen = () => {
            status.textContent = 'Connected';
            status.className = 'connected';
            frameCount = 0;
            keyframeCount = 0;
          };

          ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'nalu') {
              handleNalu(data);
            }
          };

          ws.onerror = (e) => {
            console.error('WS error:', e);
            status.textContent = 'WebSocket error';
            status.className = 'error';
          };

          ws.onclose = () => {
            status.textContent = 'Disconnected';
            status.className = '';
          };

        } catch (e) {
          console.error('MSE setup error:', e);
          status.textContent = `MSE error: ${e.message}`;
          status.className = 'error';
        }
      });
    }

    function handleNalu(data) {
      if (!sourceBuffer) return;

      const nalData = Uint8Array.from(atob(data.data), c => c.charCodeAt(0));

      // Check if SourceBuffer is ready
      if (sourceBuffer.updating) {
        console.log('SourceBuffer busy, dropping frame');
        return;
      }

      try {
        // Create MP4 container for the NAL unit
        const mp4Data = createMp4Fragment(nalData, data.isKeyframe);
        sourceBuffer.appendBuffer(mp4Data);

        frameCount++;
        fpsCounter++;
        if (data.isKeyframe) keyframeCount++;

        // Update stats
        const now = Date.now();
        if (now - lastFpsTime >= 1000) {
          const fps = fpsCounter;
          fpsCounter = 0;
          lastFpsTime = now;
          stats.textContent = `FPS: ${fps} | Frames: ${frameCount} | Keyframes: ${keyframeCount}`;
        }
      } catch (e) {
        console.error('Append error:', e);
      }
    }

    // Create minimal MP4 fragment for MSE
    function createMp4Fragment(nalData, isKeyframe) {
      // Simple approach: wrap NAL in ftyp+moov+moof+mdat
      // This is a simplified version - real implementation needs proper MP4 muxing

      const size = nalData.length;
      const mdatSize = size + 8;

      // mdat box
      const mdat = new Uint8Array(mdatSize);
      new DataView(mdat.buffer).setUint32(0, mdatSize);
      mdat[4] = 0x6d; // 'm'
      mdat[5] = 0x64; // 'd'
      mdat[6] = 0x61; // 'a'
      mdat[7] = 0x74; // 't'
      mdat.set(nalData, 8);

      return mdat;
    }

    function disconnect() {
      if (ws) {
        ws.close();
        ws = null;
      }
      if (mediaSource && mediaSource.readyState === 'open') {
        mediaSource.endOfStream();
      }
    }
  </script>
</body>
</html>
